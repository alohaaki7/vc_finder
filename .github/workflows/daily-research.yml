name: Daily lead research

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Leads to research
        required: false
        default: "20"
        type: string
      budget:
        description: Maximum treg spend for this run (USD)
        required: false
        default: "0.10"
        type: string
  schedule:
    # After the SEC refresh (12:17 UTC) has committed the day's filings
    - cron: "47 13 * * *"

permissions:
  contents: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Research the next leads
        env:
          TREG_TOKEN: ${{ secrets.TREG_TOKEN }}
          TREG_DAILY_BUDGET_USD: ${{ inputs.budget || '0.10' }}
          VC_FINDER_SEC_USER_AGENT: ${{ secrets.VC_FINDER_SEC_USER_AGENT }}
          LIMIT: ${{ inputs.limit || '20' }}
        run: python daily_research.py --limit "$LIMIT"

      - name: Commit research
        run: |
          if git diff --quiet -- RESEARCH_LEDGER.csv && git ls-files --error-unmatch RESEARCH_LEDGER.csv >/dev/null 2>&1; then
            echo "No new research."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESEARCH_LEDGER.csv
          git commit -m "Daily lead research"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 10))
          done
          exit 1
