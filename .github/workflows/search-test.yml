name: Test searches

on:
  workflow_dispatch:
    inputs:
      queries:
        description: Google queries, separated by semicolons
        required: true
        type: string

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run searches
        env:
          TREG_TOKEN: ${{ secrets.TREG_TOKEN }}
          QUERIES: ${{ inputs.queries }}
        run: |
          export QUERIES="$(printf '%s' "$QUERIES" | tr ';' '\n')"
          python search_test.py
